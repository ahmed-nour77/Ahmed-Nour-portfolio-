<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_proj-cow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="grid_proj-cow" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow_proj-cow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad_proj-cow)" rx="14"/>
  <rect width="100%" height="100%" fill="url(#grid_proj-cow)" rx="14"/>
  <circle cx="300" cy="160" r="130" fill="url(#glow_proj-cow)"/>

  <!-- Top Tech Bar -->
  <rect x="25" y="22" width="550" height="36" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="60" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="75" cy="40" r="5" fill="#10b981"/>
  <text x="95" y="44" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="12">ai-models://proj-cow</text>
  <rect x="425" y="28" width="135" height="24" rx="4" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="0.8"/>
  <text x="492" y="44" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">HEALTHCARE CV</text>

  <!-- Center Graphic -->
  <g transform="translate(300, 150)">
    <circle r="52" fill="none" stroke="rgba(0,242,254,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="38" fill="rgba(0,0,0,0.5)" stroke="rgba(0,242,254,0.6)" stroke-width="1.5"/>
    <text y="-4" fill="#00f2fe" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">AI</text>
    <text y="16" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">SYSTEM</text>
  </g>

  <!-- Titles -->
  <text x="300" y="245" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Cow Disease Detection System</text>
  <text x="300" y="275" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="13" text-anchor="middle">Computer Vision Diagnostic CNN Architecture</text>

  <!-- Bottom Line -->
  <path d="M 30 305 L 570 305" stroke="rgba(0,242,254,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>